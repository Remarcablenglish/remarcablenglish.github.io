<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>寫作救星 一字籤金｜Remarcable English</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%2300260D%22%2F%3E%3Cg%3E%3Crect%20x%3D%2223%22%20y%3D%2211%22%20width%3D%225%22%20height%3D%2220%22%20rx%3D%222.5%22%20fill%3D%22%23e9d9ae%22%20transform%3D%22rotate%28-8%2025.5%2021%29%22%2F%3E%3Crect%20x%3D%2230%22%20y%3D%227%22%20width%3D%225%22%20height%3D%2224%22%20rx%3D%222.5%22%20fill%3D%22%23f0dca8%22%2F%3E%3Crect%20x%3D%2237%22%20y%3D%2212%22%20width%3D%225%22%20height%3D%2219%22%20rx%3D%222.5%22%20fill%3D%22%23d9c28a%22%20transform%3D%22rotate%288%2039.5%2021%29%22%2F%3E%3C%2Fg%3E%3Cpath%20d%3D%22M17%2028%20h30%20a3%203%200%200%201%203%203%20v18%20a6%206%200%200%201%20-6%206%20h-24%20a6%206%200%200%201%20-6%20-6%20v-18%20a3%203%200%200%201%203%20-3z%22%20fill%3D%22%238a5a2b%22%2F%3E%3Cellipse%20cx%3D%2232%22%20cy%3D%2228%22%20rx%3D%2216.5%22%20ry%3D%224%22%20fill%3D%22%235e3a17%22%2F%3E%3Crect%20x%3D%2214%22%20y%3D%2235%22%20width%3D%2236%22%20height%3D%225%22%20rx%3D%222.5%22%20fill%3D%22%23D1B06B%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2247%22%20r%3D%225.5%22%20fill%3D%22%23a33327%22%2F%3E%3C%2Fsvg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#00260D;
  --deep2:#003815;
  --gold:#D1B06B;
  --gold-hi:#f0dCA8;
  --cream:#faf8f3;
  --ink:#2c2a25;
  --muted:#7a7568;
  --border:#e8e4da;
  --wood:#8a5a2b;
  --wood-dark:#5e3a17;
  --red:#a33327;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:-apple-system,'Noto Sans TC','PingFang TC',sans-serif;
  background:var(--cream);color:var(--ink);
  font-size:15px;line-height:1.6;
  max-width:680px;margin:0 auto;padding-bottom:60px;
}

/* ── header ── */
header{
  background:var(--deep);
  padding:18px 20px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.h-title{display:flex;flex-direction:column;gap:3px;}
.h-en{font-family:'Cinzel',Georgia,serif;font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--gold);}
.h-zh{font-family:'Noto Serif TC',serif;font-size:22px;font-weight:900;letter-spacing:.3em;color:var(--gold-hi);}
.h-sub{font-size:10px;color:#c8b98a;letter-spacing:.12em;}
.h-back{font-size:11px;color:#9fb08a;text-decoration:none;letter-spacing:.06em;white-space:nowrap;opacity:.85;}
.h-back:hover{color:var(--gold);}

/* ── quota bar ── */
.quota-bar{
  background:var(--deep2);
  padding:8px 20px;
  display:flex;align-items:center;justify-content:space-between;
  font-size:12px;color:#c8b98a;letter-spacing:.05em;
}
.quota-sticks{display:flex;gap:5px;}
.q-dot{
  width:9px;height:22px;border-radius:3px;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold));
  transition:opacity .3s, filter .3s;
}
.q-dot.used{opacity:.18;filter:grayscale(1);}

/* ── genre tabs ── */
.tabs{display:flex;gap:8px;padding:16px 20px 4px;}
.tab{
  flex:1;padding:9px 0;text-align:center;
  border:1.5px solid var(--border);border-radius:24px;
  background:#fff;font-size:14px;letter-spacing:.2em;
  color:var(--muted);cursor:pointer;transition:all .18s;
  font-family:'Noto Serif TC',serif;font-weight:600;
}
.tab.active{background:var(--deep);border-color:var(--deep);color:var(--gold-hi);}

/* ── stage ── */
.stage{
  position:relative;
  display:flex;flex-direction:column;align-items:center;
  padding:26px 20px 10px;
  min-height:300px;
}
.tube-wrap{position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.tube{
  width:130px;height:180px;
  background:linear-gradient(90deg,var(--wood-dark) 0%,var(--wood) 22%,#a9773f 50%,var(--wood) 78%,var(--wood-dark) 100%);
  border-radius:14px 14px 22px 22px;
  position:relative;
  box-shadow:0 14px 30px rgba(0,38,13,.28), inset 0 -14px 22px rgba(0,0,0,.25);
}
.tube::before{
  content:'';position:absolute;top:-9px;left:-6px;right:-6px;height:20px;
  background:linear-gradient(90deg,#3f2810,#6d4a20 25%,#8a5f2e 50%,#6d4a20 75%,#3f2810);
  border-radius:50%/70%;
  box-shadow:inset 0 3px 5px rgba(0,0,0,.5);
}
.tube-band{
  position:absolute;left:-3px;right:-3px;height:10px;
  background:linear-gradient(90deg,#8a6a2e,var(--gold) 30%,var(--gold-hi) 50%,var(--gold) 70%,#8a6a2e);
  border-radius:4px;
  box-shadow:0 1px 3px rgba(0,0,0,.35);
}
.band-1{top:34px;}
.band-2{bottom:26px;}
.tube-seal{
  position:absolute;top:58px;left:50%;transform:translateX(-50%);
  width:56px;height:56px;border-radius:50%;
  background:var(--red);
  display:flex;align-items:center;justify-content:center;
  font-family:'Noto Serif TC',serif;font-weight:900;font-size:22px;color:#f5e6c0;
  letter-spacing:.05em;
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.3);
  border:2px solid rgba(245,230,192,.5);
}
.tube-sticks{
  position:absolute;top:-46px;left:50%;transform:translateX(-50%);
  display:flex;gap:7px;align-items:flex-end;z-index:-1;
}
.t-stick{
  width:10px;background:linear-gradient(180deg,#e9d9ae,#c9ac6e);
  border-radius:4px 4px 0 0;
  box-shadow:1px 0 2px rgba(0,0,0,.2);
}
.ts1{height:52px;}.ts2{height:66px;}.ts3{height:46px;}.ts4{height:60px;}.ts5{height:54px;}

.tube-hint{
  margin-top:22px;font-size:13px;color:var(--muted);letter-spacing:.15em;text-align:center;
}
.tube-hint strong{color:var(--deep);letter-spacing:.2em;}

@keyframes shake{
  0%,100%{transform:rotate(0);}
  15%{transform:rotate(-7deg) translateY(-4px);}
  30%{transform:rotate(6deg);}
  45%{transform:rotate(-5deg) translateY(-3px);}
  60%{transform:rotate(4deg);}
  75%{transform:rotate(-2deg);}
}
@keyframes idleBob{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-4px);}
}
.tube-wrap:not(.shaking):not(.cooling){animation:idleBob 2.6s ease-in-out infinite;}
.guide-finger{
  position:absolute;top:38%;left:50%;transform:translateX(-50%);
  z-index:8;pointer-events:none;text-align:center;
}
.guide-finger .gf-hand{
  font-size:34px;display:block;
  animation:tapBounce 1.1s ease-in-out infinite;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));
}
.guide-finger .gf-txt{
  display:inline-block;margin-top:2px;
  background:var(--deep);color:var(--gold-hi);
  font-size:12px;letter-spacing:.15em;padding:4px 12px;border-radius:14px;
  font-family:'Noto Serif TC',serif;font-weight:600;
  box-shadow:0 3px 8px rgba(0,38,13,.3);white-space:nowrap;
}
@keyframes tapBounce{
  0%,100%{transform:translateY(0) rotate(-12deg);}
  50%{transform:translateY(12px) rotate(-12deg);}
}
.tube-wrap.shaking .tube{animation:shake .8s ease-in-out;}
.tube-wrap.shaking .tube-sticks{animation:shake .8s ease-in-out reverse;}

.cooldown-tag{
  position:absolute;inset:0;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:4px;
  background:rgba(0,38,13,.78);border-radius:14px 14px 22px 22px;
  color:var(--gold-hi);font-size:12px;letter-spacing:.1em;text-align:center;padding:10px;
  z-index:5;
}
.cooldown-tag .cd-num{font-family:'Cinzel',serif;font-size:30px;font-weight:700;color:var(--gold);}
.tube-wrap.cooling .cooldown-tag{display:flex;}

/* ── daily golden draw ── */
.daily-row{padding:6px 20px 0;display:flex;justify-content:center;}
.daily-btn{
  border:1.5px solid var(--gold);cursor:pointer;
  background:rgba(209,176,107,.08);
  color:#8a6a2e;font-weight:600;font-size:12.5px;letter-spacing:.15em;
  padding:8px 22px;border-radius:24px;
  font-family:'Noto Serif TC',serif;
  transition:transform .15s, opacity .3s, background .15s;
}
.daily-btn:active{transform:scale(.96);background:rgba(209,176,107,.22);}
.daily-btn:disabled{opacity:.35;cursor:default;box-shadow:none;}

/* ── results ── */
.results{padding:18px 16px 8px;display:flex;flex-direction:column;gap:12px;}
.stick-card{
  background:#fff;border:1px solid var(--border);border-radius:12px;
  padding:14px 16px 13px;position:relative;overflow:hidden;
  opacity:0;transform:translateY(18px);
  animation:rise .5s ease forwards;
  border-left:4px solid var(--gold);
}
.stick-card.gold-draw{
  border:1px solid var(--gold);border-left:5px solid #b8922a;
  background:linear-gradient(160deg,#fffdf5,#fbf3dd);
  box-shadow:0 4px 16px rgba(184,146,42,.18);
}
.stick-card:nth-child(1){animation-delay:.05s;}
.stick-card:nth-child(2){animation-delay:.22s;}
.stick-card:nth-child(3){animation-delay:.4s;}
@keyframes rise{to{opacity:1;transform:translateY(0);}}
.sc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sc-tag{
  font-size:10px;font-weight:700;letter-spacing:.15em;
  background:var(--deep);color:var(--gold-hi);
  padding:2px 9px;border-radius:10px;flex-shrink:0;
  font-family:'Noto Serif TC',serif;
}
.sc-stars{font-size:11px;color:#b8922a;letter-spacing:2px;flex-shrink:0;}
.gold-label{
  font-size:10px;font-weight:700;color:#b8922a;letter-spacing:.25em;
  margin-bottom:4px;font-family:'Noto Serif TC',serif;
}

/* 小鴨鴨 → 天鵝 */
.sc-before{
  margin-top:9px;
  display:flex;align-items:baseline;gap:7px;
  font-size:13.5px;color:#a09a8c;
}
.sc-before .b-icon{flex-shrink:0;font-size:13px;filter:grayscale(.4);}
.sc-before .b-text{text-decoration:line-through;text-decoration-color:#c9b08a;text-decoration-thickness:1.5px;}
.sc-arrow{
  margin:2px 0 2px 3px;
  font-size:12px;color:var(--gold);letter-spacing:.1em;
  display:flex;align-items:center;gap:6px;
}
.sc-arrow::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent);}
.sc-after{
  display:flex;align-items:baseline;gap:7px;
}
.sc-after .a-icon{flex-shrink:0;font-size:14px;}
.sc-en{font-size:17px;font-weight:700;color:var(--ink);line-height:1.45;}
.sc-zh{font-size:13px;color:var(--muted);margin-top:2px;padding-left:23px;}
.sc-ex{
  margin-top:9px;padding:8px 11px 8px 23px;position:relative;
  background:var(--cream);border-radius:8px;
  font-size:13px;color:#555;font-style:italic;line-height:1.55;
}
.gold-draw .sc-ex{background:rgba(255,255,255,.65);}
.sc-ex::before{
  content:'例';position:absolute;left:7px;top:9px;
  font-style:normal;font-size:9px;color:var(--gold);
  font-family:'Noto Serif TC',serif;font-weight:700;
}
.sc-actions{margin-top:9px;display:flex;gap:8px;justify-content:flex-end;}
.sc-copy{
  border:1px solid var(--border);background:#fff;border-radius:8px;
  font-size:12px;padding:3px 12px;cursor:pointer;color:var(--muted);
  transition:all .15s;
}
.sc-copy:active{background:var(--deep);color:var(--gold-hi);border-color:var(--deep);}

/* notices */
.notice{
  margin:14px 20px 0;padding:16px;text-align:center;
  border:1.5px dashed var(--gold);border-radius:12px;
  color:var(--muted);font-size:13px;line-height:1.8;
  display:none;
}
.notice strong{color:var(--deep);}
.notice.show{display:block;}

/* footer */
.foot{
  margin:34px 20px 0;padding:22px 18px;
  background:var(--deep);border-radius:14px;text-align:center;
}
.foot-line{
  font-family:'Noto Serif TC',serif;font-weight:600;
  color:var(--gold-hi);font-size:15px;letter-spacing:.12em;line-height:1.9;
}
.foot-line em{font-style:normal;color:var(--gold);border-bottom:1px solid rgba(209,176,107,.4);padding-bottom:1px;}
.foot-btns{margin-top:14px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;}
.foot-line-btn{
  background:var(--gold);color:#1a1a1a;text-decoration:none;
  font-size:14px;padding:9px 26px;border-radius:2px;letter-spacing:.08em;
}
.foot-mail-btn{
  color:#e8e0d0;text-decoration:none;border:1px solid var(--gold);
  font-size:14px;padding:9px 26px;border-radius:2px;letter-spacing:.08em;
}
.brand-foot{
  text-align:center;margin-top:22px;
  font-family:'Cinzel',serif;font-size:10px;letter-spacing:.25em;color:var(--muted);
}

/* ── 圖鑑 籤藏不露 ── */
.dex-link{
  margin:12px 20px 0;padding:9px 0;text-align:center;cursor:pointer;
  border:1.5px solid var(--gold);border-radius:24px;
  font-family:'Noto Serif TC',serif;font-weight:600;font-size:14px;
  color:var(--deep);letter-spacing:.15em;background:rgba(209,176,107,.08);
  -webkit-tap-highlight-color:transparent;transition:background .15s;
}
.dex-link:active{background:rgba(209,176,107,.22);}
.dex-link span{color:#b8922a;font-size:12px;letter-spacing:.05em;}
#dexWrap{display:none;padding:18px 16px 8px;}
.dex-head{font-family:'Noto Serif TC',serif;font-weight:900;font-size:22px;letter-spacing:.25em;color:var(--deep);text-align:center;}
.dex-sub{text-align:center;font-size:12px;color:var(--muted);letter-spacing:.2em;margin-top:2px;}
.dex-title-badge{
  margin:12px auto 4px;width:fit-content;padding:6px 22px;border-radius:20px;
  background:var(--deep);color:var(--gold-hi);font-family:'Noto Serif TC',serif;
  font-size:14px;letter-spacing:.12em;
}
.dex-prog{margin:10px 6px 0;font-size:12px;color:var(--muted);}
.dex-bar{height:8px;background:#eee5d2;border-radius:4px;margin-top:3px;overflow:hidden;}
.dex-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-hi));border-radius:4px;transition:width .4s;}
.dex-sec{margin:18px 2px 8px;font-family:'Noto Serif TC',serif;font-weight:600;font-size:13px;color:var(--deep);letter-spacing:.1em;border-left:3px solid var(--gold);padding-left:8px;}
.dex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
.dex-card{background:#fff;border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:10px;padding:8px 10px;}
.dex-card .dc-top{display:flex;justify-content:space-between;font-size:10px;}
.dex-card .dc-id{color:var(--muted);letter-spacing:.05em;}
.dex-card .dc-st{color:#b8922a;letter-spacing:1px;}
.dex-card .dc-en{font-size:12.5px;font-weight:700;color:var(--ink);margin-top:4px;line-height:1.4;}
.dex-card .dc-zh{font-size:11px;color:var(--muted);margin-top:2px;}
.dex-card.locked{background:#efece4;border-style:dashed;opacity:.75;}
.dex-card.locked .dc-en{color:#b9b2a2;letter-spacing:.3em;}
.dex-rule{
  margin:26px 4px 6px;padding:14px;border:1.5px dashed var(--gold);border-radius:12px;
  font-size:12px;color:var(--muted);text-align:center;line-height:1.9;
}

.dex-card:not(.locked){cursor:pointer;transition:transform .15s, box-shadow .15s;}
.dex-card:not(.locked):active{transform:scale(.96);box-shadow:0 2px 10px rgba(184,146,42,.25);}

/* ── 圖鑑小卡彈窗 ── */
.dex-modal{
  position:fixed;inset:0;background:rgba(0,38,13,.6);
  display:none;align-items:center;justify-content:center;
  z-index:500;padding:22px;
}
.dex-modal.show{display:flex;}
.dex-modal-inner{position:relative;width:100%;max-width:420px;}
.dex-modal-inner .stick-card{
  opacity:1;transform:none;animation:popCard .28s ease;
  box-shadow:0 16px 44px rgba(0,0,0,.35);
}
@keyframes popCard{
  from{opacity:0;transform:translateY(16px) scale(.96);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
.dex-modal-close{
  position:absolute;top:-14px;right:-4px;width:34px;height:34px;border-radius:50%;
  border:1.5px solid var(--gold);background:var(--deep);color:var(--gold-hi);
  font-size:15px;line-height:1;cursor:pointer;z-index:2;
  box-shadow:0 3px 10px rgba(0,0,0,.35);
}
.dex-modal-hint{
  text-align:center;margin-top:10px;font-size:11px;color:#c8b98a;letter-spacing:.15em;
}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:8px 18px;border-radius:20px;
  font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:999;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media (prefers-reduced-motion: reduce){
  .tube-wrap.shaking .tube,.tube-wrap.shaking .tube-sticks{animation:none;}
  .stick-card{animation-duration:.01s;}
}
</style>
</head>
<body>

<header>
  <div class="h-title">
    <div class="h-en">REMARCABLE ENGLISH</div>
    <div class="h-zh">寫作救星</div>
    <div class="h-sub">一字籤金 · 不知道怎麼寫，就搖一支</div>
  </div>
  <a class="h-back" href="../">← 回首頁</a>
</header>

<div class="quota-bar">
  <span>寫作救星 · 每日籤運</span>
  <div style="display:flex;align-items:center;gap:12px;">
    <span id="quotaText" style="color:#f0dca8;font-size:13px;letter-spacing:.08em;font-weight:600;">今日籤數：5 / 5</span>
    <button id="sndBtn" onclick="toggleSound(event)" style="background:none;border:1px solid rgba(209,176,107,.4);border-radius:8px;color:#c8b98a;font-size:12px;padding:2px 8px;cursor:pointer;">🔊</button>
  </div>
</div>

<div class="tabs" id="tabs">
  <div class="tab active" data-g="argue">🧠 講道理</div>
  <div class="tab" data-g="narrate">💬 說故事</div>
  <div class="tab" data-g="depict">🎥 學分鏡</div>
</div>

<div class="dex-link" id="dexLink" onclick="toggleDex()">📖 我已收集　<span id="dexCount"></span>　金句</div>

<div class="stage">
  <div class="tube-wrap" id="tubeWrap" onclick="shake()">
    <div class="guide-finger" id="guideFinger" style="display:none;">
      <span class="gf-hand">👆</span>
      <span class="gf-txt">點我搖籤</span>
    </div>
    <div class="tube-sticks">
      <div class="t-stick ts1"></div><div class="t-stick ts2"></div><div class="t-stick ts3"></div><div class="t-stick ts4"></div><div class="t-stick ts5"></div>
    </div>
    <div class="tube">
      <div class="tube-band band-1"></div>
      <div class="tube-band band-2"></div>
      <div class="tube-seal">籤</div>
      <div class="cooldown-tag">
        <div>籤筒冷卻中</div>
        <div class="cd-num" id="cdNum">60</div>
        <div>好句需要沉澱</div>
      </div>
    </div>
  </div>
  <div class="tube-hint">點籤筒 <strong>搖一次</strong>，出 1–3 支，看籤運</div>
  <div id="personalCount" style="margin-top:8px;font-size:12px;color:#b8922a;letter-spacing:.1em;text-align:center;min-height:16px;"></div>
</div>

<div class="notice" id="notice"></div>

<div class="results" id="results"></div>

<div id="dexWrap"></div>

<div class="foot">

/* ═══ 圖鑑「籤藏不露」— ID 已寫死在每支籤資料內，依母本「編號即真相，剔除留空不遞補」（a92、d15 留空）═══ */
(function checkIds(){
  const seen=new Set();
  ['argue','narrate','depict'].forEach(g=>POOL[g].forEach(x=>{
    if(!x.id||seen.has(x.id))console.error('籤支 ID 缺漏或重複：',g,x.id,x.e);
    seen.add(x.id);
  }));
})();
const VALID_IDS=new Set();
['argue','narrate','depict'].forEach(g=>POOL[g].forEach(x=>VALID_IDS.add(x.id)));
const TOTAL=POOL.argue.length+POOL.narrate.length+POOL.depict.length;

function unlockedIds(){try{return JSON.parse(store.getItem('dex_unlocked')||'[]').filter(id=>VALID_IDS.has(id));}catch(e){return[];}}
function recordUnlocks(items){
  const u=new Set(unlockedIds());
  items.forEach(x=>u.add(x.id));
  store.setItem('dex_unlocked',JSON.stringify([...u]));
  updateDexCount();
}
function titleFor(n){
  if(n>=TOTAL)return '🌟 文氣附體 · 閱卷教授的救贖';
  if(n>=81)return '🦢 驚為天鵝';
  if(n>=31)return '🐥 鴨力釋放';
  return '🐣 嗷嗷待哺';
}
function updateDexCount(){
  const el=document.getElementById('dexCount');
  if(el)el.textContent=unlockedIds().length+'/'+TOTAL;
}
let dexOpen=false;
function toggleDex(){
  dexOpen=!dexOpen;
  const set=(sel,show)=>{const el=document.querySelector(sel);if(el)el.style.display=show?'':'none';};
  set('#tabs',!dexOpen);set('.stage',!dexOpen);set('.daily-row',!dexOpen);set('#results',!dexOpen);
  document.getElementById('notice').classList.remove('show');
  const w=document.getElementById('dexWrap');
  const link=document.getElementById('dexLink');
  if(dexOpen){
    renderDex();w.style.display='block';
    link.innerHTML='← 返回搖籤　<span id="dexCount"></span>';
  }else{
    w.style.display='none';
    link.innerHTML='📖 我已收集　<span id="dexCount"></span>　金句';
  }
  updateDexCount();
}
function dexProg(label,got,total){
  const pct=Math.round(got/total*100);
  return `<div class="dex-prog"><span>${label}　${got} / ${total}</span><div class="dex-bar"><div class="dex-bar-fill" style="width:${pct}%"></div></div></div>`;
}
function renderDex(){
  const u=new Set(unlockedIds());
  const got=g=>POOL[g].filter(x=>u.has(x.id)).length;
  let h='<div class="dex-head">【籤藏不露】</div><div class="dex-sub">小鴨鴨的羽化錄</div>';
  h+=`<div class="dex-title-badge">${titleFor(u.size)}</div>`;
  h+=dexProg('🧠 講道理',got('argue'),POOL.argue.length);
  h+=dexProg('💬 說故事',got('narrate'),POOL.narrate.length);
  h+=dexProg('🎥 學分鏡',got('depict'),POOL.depict.length);
  [['argue','🧠 講道理'],['narrate','💬 說故事'],['depict','🎥 學分鏡']].forEach(([g,label])=>{
    const cats=[...new Set(POOL[g].map(x=>x.t))];
    cats.forEach(c=>{
      const items=POOL[g].filter(x=>x.t===c);
      const gc=items.filter(x=>u.has(x.id)).length;
      h+=`<div class="dex-sec">${label} · ${c}（${gc}/${items.length}）</div><div class="dex-grid">`;
      items.forEach(x=>{
        if(u.has(x.id)){
          h+=`<div class="dex-card" onclick="openDexCard('${x.id}')"><div class="dc-top"><span class="dc-id">${x.id}</span><span class="dc-st">${stars(x.s)}</span></div><div class="dc-en">${esc(x.e)}</div><div class="dc-zh">${esc(x.z)}</div></div>`;
        }else{
          h+=`<div class="dex-card locked" onclick="toast('這支還沒抽中，先去搖籤 🎋')"><div class="dc-top"><span class="dc-id">${x.id}</span><span class="dc-st">${stars(x.s)}</span></div><div class="dc-en">？？？</div><div class="dc-zh">尚未抽中</div></div>`;
        }
      });
      h+='</div>';
    });
  });
  h+='<div class="dex-rule">📜 藏句守則<br>本圖鑑進度仰賴天地靈氣（瀏覽器暫存）封存。<br>籤運如浮雲，清快取如失憶。<br>清除瀏覽器資料或更換設備，收集進度將化為烏有，一切重頭修煉。</div>';
  document.getElementById('dexWrap').innerHTML=h;
}

/* ═══ 圖鑑小卡彈窗 ═══ */
function findStick(id){
  for(const g of ['argue','narrate','depict']){
    const f=POOL[g].find(x=>x.id===id);
    if(f)return f;
  }
  return null;
}
function openDexCard(id){
  const item=findStick(id);
  if(!item)return;
  document.getElementById('dexModalCard').innerHTML=
  `<div class="stick-card">
    <div class="sc-top">
      <span class="sc-tag">${item.t}</span>
      <span class="sc-stars">${stars(item.s)}</span>
      <span style="margin-left:auto;font-size:10px;color:var(--muted);letter-spacing:.05em;">${item.id}</span>
    </div>
    <div class="sc-before"><span class="b-icon">🐣</span><span class="b-text">${esc(item.b)}</span></div>
    <div class="sc-arrow">蛻變</div>
    <div class="sc-after"><span class="a-icon">🦢</span><span class="sc-en">${esc(item.e)}</span></div>
    <div class="sc-zh">${esc(item.z)}</div>
    <div class="sc-ex">${esc(item.ex)}</div>
    <div class="sc-actions"><button class="sc-copy" onclick="copyDexStick('${item.id}')">複製句型＋例句</button></div>
  </div>`;
  document.getElementById('dexModal').classList.add('show');
}
function closeDexCard(){
  document.getElementById('dexModal').classList.remove('show');
}
function copyDexStick(id){
  const item=findStick(id);
  if(!item)return;
  const text=item.e+'（'+item.z+'）\n例：'+item.ex;
  if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>toast('已複製，拿去用 ✅')).catch(()=>fallbackCopy(text));}
  else fallbackCopy(text);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDexCard();});

/* ═══════════ 遊戲參數 ═══════════ */
const DAILY_QUOTA = 5;
const COOLDOWN_S  = 60;
const DRAW_MIN = 1;   // 一搖最少出幾支
const DRAW_MAX = 3;   // 一搖最多出幾支

const store = (()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return localStorage;}
 catch(e){const m={};return{getItem:k=>(k in m?m[k]:null),setItem:(k,v)=>{m[k]=String(v);},removeItem:k=>{delete m[k];}};}})();

function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function resetIfNewDay(){
  if(store.getItem('qt_date')!==today()){
    store.setItem('qt_date',today());
    store.setItem('qt_used','0');
    store.setItem('qt_gold','0');
    store.setItem('qt_last','0');
  }
}
function used(){return parseInt(store.getItem('qt_used')||'0',10);}
function lifetimeShakes(){return parseInt(store.getItem('qt_lifetime')||'0',10);}
function ordinalZh(n){return n;}
function goldUsed(){return store.getItem('qt_gold')==='1';}
function lastShake(){return parseInt(store.getItem('qt_last')||'0',10);}
function cooldownLeft(){
  const left=COOLDOWN_S-Math.floor((Date.now()-lastShake())/1000);
  return left>0?left:0;
}

let genre='argue';

/* ═══════════ UI ═══════════ */
function renderQuota(){
  const el=document.getElementById('quotaText');
  if(!el)return;
  const left=DAILY_QUOTA-used();
  el.textContent=left>0?('今日籤數：'+left+' / '+DAILY_QUOTA):'今日已搖完，明日再來';
  el.style.color=left>0?'#f0dca8':'#c8927a';
}
function renderPersonalCount(){
  const el=document.getElementById('personalCount');
  if(!el)return;
  const life=lifetimeShakes();
  if(life<=0){el.textContent='🎋 搖響籤筒，求你今天的第一支籤';return;}
  el.innerHTML='🎋 你已與籤筒結緣 <b>'+life+'</b> 回';
}
function showNotice(html){
  const n=document.getElementById('notice');
  n.innerHTML=html;n.classList.add('show');
}
function hideNotice(){document.getElementById('notice').classList.remove('show');}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1800);
}
function stars(n){return n>=4?'UR ✦':'★★★'.slice(0,n);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

let lastDraw=[];
function stickHTML(item,idx,gold){
  return `<div class="stick-card${gold?' gold-draw':''}">
    ${gold?'<div class="gold-label">今日金籤</div>':''}
    <div class="sc-top">
      <span class="sc-tag">${item.t}</span>
      <span class="sc-stars">${stars(item.s)}</span>
    </div>
    <div class="sc-before"><span class="b-icon">🐣</span><span class="b-text">${esc(item.b)}</span></div>
    <div class="sc-arrow">蛻變</div>
    <div class="sc-after"><span class="a-icon">🦢</span><span class="sc-en">${esc(item.e)}</span></div>
    <div class="sc-zh">${esc(item.z)}</div>
    <div class="sc-ex">${esc(item.ex)}</div>
    <div class="sc-actions"><button class="sc-copy" onclick="copyStick(${idx})">複製句型＋例句</button></div>
  </div>`;
}

function drawFrom(pool,n){
  const bag=[...pool];
  const out=[];
  while(out.length<n&&bag.length){
    out.push(bag.splice(Math.floor(Math.random()*bag.length),1)[0]);
  }
  return out;
}

/* ═══════════ 搖籤 ═══════════ */
let cdTimer=null;
function startCooldownUI(){
  const wrap=document.getElementById('tubeWrap');
  const num=document.getElementById('cdNum');
  function tick(){
    const left=cooldownLeft();
    if(left<=0){wrap.classList.remove('cooling');clearInterval(cdTimer);cdTimer=null;return;}
    wrap.classList.add('cooling');
    num.textContent=left;
  }
  tick();
  if(!cdTimer)cdTimer=setInterval(tick,500);
}

function shake(){
  resetIfNewDay();
  if(cooldownLeft()>0){
    toast('冷卻中… 連 AI 都有使用額度，何況籤筒 😌');
    startCooldownUI();
    return;
  }
  if(used()>=DAILY_QUOTA){
    showNotice('今日籤運已盡 🎋<br><strong>明日額度重置。</strong><br>等不及的話——整篇文章的事，直接找 Marc。');
    toast('今日額度用完了');
    return;
  }
  hideNotice();
  if(store.getItem('guide_done')!=='1'){
    store.setItem('guide_done','1');
    const gf=document.getElementById('guideFinger');
    if(gf)gf.style.display='none';
  }
  const wrap=document.getElementById('tubeWrap');
  wrap.classList.add('shaking');
  rattle();
  setTimeout(()=>wrap.classList.remove('shaking'),850);

  store.setItem('qt_used',String(used()+1));
  store.setItem('qt_last',String(Date.now()));
  store.setItem('qt_lifetime',String(lifetimeShakes()+1));
  renderQuota();

  const n=DRAW_MIN+Math.floor(Math.random()*(DRAW_MAX-DRAW_MIN+1));
  lastDraw=drawFrom(POOL[genre],n);
  recordUnlocks(lastDraw);
  setTimeout(()=>{
    document.getElementById('results').innerHTML=lastDraw.map((p,i)=>stickHTML(p,i,false)).join('');
    renderPersonalCount();
    if(n===1)toast('籤筒今天心情普通，只肯給一支 🎋');
    else if(n===3)toast('籤運大開！一次三支 ✨');
    if(used()>=DAILY_QUOTA){
      showNotice('這是今天最後一搖 🎋<br>覺得不夠用？<strong>整篇文章的事，找 Marc。</strong>');
    }else{
      startCooldownUI();
    }
  },700);
}


/* ═══════════ 複製 ═══════════ */
function copyStick(idx){
  const item=lastDraw[idx];
  if(!item)return;
  const text=item.e+'（'+item.z+'）\n例：'+item.ex;
  if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>toast('已複製，拿去用 ✅')).catch(()=>fallbackCopy(text));}
  else fallbackCopy(text);
}
function fallbackCopy(t){
  const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);
  ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('已複製 ✅');
}

/* ═══════════ tabs ═══════════ */
document.getElementById('tabs').addEventListener('click',e=>{
  const t=e.target.closest('.tab');if(!t)return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');genre=t.dataset.g;
  document.getElementById('results').innerHTML='';
  lastDraw=[];
  hideNotice();
});

/* ═══════════ 籤筒聲（Web Audio 即時合成木籤碰撞聲，免音檔）═══════════ */
let audioCtx=null,soundOn=true;
function toggleSound(ev){
  ev.stopPropagation();
  soundOn=!soundOn;
  document.getElementById('sndBtn').textContent=soundOn?'🔊':'🔇';
  toast(soundOn?'籤筒聲已開啟':'籤筒聲已關閉');
}
function rattle(){
  if(!soundOn)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const now=audioCtx.currentTime;
    const clicks=12+Math.floor(Math.random()*8);
    for(let i=0;i<clicks;i++){
      const t=now+Math.random()*0.8;
      const dur=0.02+Math.random()*0.04;
      const buf=audioCtx.createBuffer(1,Math.max(1,Math.floor(audioCtx.sampleRate*dur)),audioCtx.sampleRate);
      const d=buf.getChannelData(0);
      for(let j=0;j<d.length;j++){d[j]=(Math.random()*2-1)*Math.pow(1-j/d.length,2.5);}
      const src=audioCtx.createBufferSource();src.buffer=buf;
      const bp=audioCtx.createBiquadFilter();bp.type='bandpass';
      bp.frequency.value=900+Math.random()*2200;bp.Q.value=7;
      const g=audioCtx.createGain();
      g.gain.setValueAtTime(0.18+Math.random()*0.22,t);
      src.connect(bp);bp.connect(g);g.connect(audioCtx.destination);
      src.start(t);
    }
  }catch(e){}
}

/* init */
/* 舊版編號搬遷：v3 前的 a92（It is high time）依母本改編為 a91，收集紀錄自動轉移 */
try{
  const raw=JSON.parse(store.getItem('dex_unlocked')||'[]');
  if(Array.isArray(raw)&&raw.includes('a92')){
    store.setItem('dex_unlocked',JSON.stringify([...new Set(raw.map(id=>id==='a92'?'a91':id))]));
  }
}catch(e){}
resetIfNewDay();
renderQuota();
renderPersonalCount();
updateDexCount();
if(store.getItem('guide_done')!=='1'){
  document.getElementById('guideFinger').style.display='block';
}
if(cooldownLeft()>0)startCooldownUI();
</script>
