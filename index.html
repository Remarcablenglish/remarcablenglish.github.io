<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remarcable English｜馬克精緻語言訓練</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #001a09; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Cinzel', serif; }
    
    /* 將舞台設為垂直彈性佈局，確保所有內容依序排列，不會重疊 */
    #stage {
        width: 100%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        position: relative;
    }

    #parchment-wrap {
        position: relative;
        width: 360px;
        height: 460px;
        flex-shrink: 0; /* 防止被擠壓 */
    }

    /* 以下保留您的原始視覺樣式 */
    #parchment { position: absolute; inset: 0; background: linear-gradient(135deg, #e8d8a0 0%, #f4eacb 30%, #ecdcb4 60%, #e2d4a8 100%); border-radius: 3px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    #parchment-content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 44px 36px; z-index: 2; }
    
    #re-title { font-size: 13px; letter-spacing: 0.22em; color: #8a6a1a; margin-bottom: 3px; }
    #re-sub { font-size: 10px; letter-spacing: 0.24em; color: #a07830; margin-bottom: 20px; }
    .divider { width: 200px; height: 1px; background: linear-gradient(90deg,transparent,#c8a84a,transparent); margin: 20px 0; }
    
    #three-jing { display: flex; gap: 20px; }
    .jing-item { text-align: center; }
    .jing-zh { font-size: 22px; color: #7a5810; }
    .jing-en { font-size: 9px; color: #a07830; margin-top: 5px; display: block; }
    
    #voice-line { font-size: 17px; color: #5a3e0a; font-style: italic; }
    #voice-sub { font-size: 9px; color: #9a7830; margin-top: 8px; }

    /* 修復後的選單區塊，改為相對定位，使其跟隨在主內容下方 */
    #menu {
        margin-top: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
        width: 100%;
        max-width: 360px;
    }
    .menu-btn {
        width: 100%;
        padding: 14px 20px;
        border: 1px solid #7a6030;
        color: #c8a84a;
        text-decoration: none;
        text-align: center;
        display: block;
    }
</style>
</head>
<body>

<div id="stage">
    <div id="parchment-wrap">
        <div id="parchment"></div>
        <div id="parchment-content">
            <div id="re-title">REMARCABLE ENGLISH</div>
            <div id="re-sub">馬克精緻語言訓練</div>
            <div class="divider"></div>
            <div id="three-jing">
                <div class="jing-item"><span class="jing-zh">精緻</span><span class="jing-en">refined</span></div>
                <div class="jing-item"><span class="jing-zh">精準</span><span class="jing-en">precise</span></div>
                <div class="jing-item"><span class="jing-zh">精通</span><span class="jing-en">mastery</span></div>
            </div>
            <div class="divider"></div>
            <div id="voice-line">make your voice heard</div>
            <div id="voice-sub">clearly · naturally · yours</div>
        </div>
    </div>

    <div id="menu">
        <a class="menu-btn" href="./GSATvocab3-4/">學測寫作高分搭配詞</a>
        <a class="menu-btn" href="./about.html">關於 Marc</a>
    </div>
</div>

</body>
</html>
